services:
  app:
    build:
      context: .
      target: dev
    image: nebus-test:dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - nuxt_cache:/app/.nuxt
    environment:
      NODE_ENV: development
    restart: unless-stopped

volumes:
  node_modules:
  nuxt_cache:
